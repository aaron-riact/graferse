# Manual release: bumps package.json, tags, and creates a GitHub Release.
#
# Usage: gh workflow run release --field bump=minor
#        (bump is one of patch, minor, major)
#
# A clean CI checkout is used on purpose: local `npm version` runs
# `preversion` (lint) over your working dir, so untracked scratch files
# break it. CI only sees committed files, so it does not.
#
# Two jobs keep package code away from write access: `prepare` installs,
# tests and bumps the version with a read-only token, then hands over only
# the package.json / package-lock.json diff. `publish` applies that diff to
# the exact commit `prepare` tested, and its push fails rather than
# releasing untested code if the default branch has moved since.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver part to bump'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --silent --verbose
      - run: npm run lint
      - run: npm run typecheck
      # files only: the commit and tag are made in `publish`
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - run: git diff -- package.json package-lock.json > release.patch
      - uses: actions/upload-artifact@v4
        with:
          name: release-patch
          path: release.patch
          retention-days: 1

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      actions: write  # dispatch npm-publish.yml
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: release
      - run: git apply release/release.patch
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
      # fast-forward only: a default branch that moved since `prepare`
      # rejects the push, and --atomic keeps the tag from landing alone
      - name: Push version commit and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --generate-notes
      # the Release above is made by GITHUB_TOKEN, so it does not start
      # npm-publish.yml; dispatching is the one event that token can fire
      - name: Publish to npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh workflow run npm-publish.yml --ref "v$VERSION"
